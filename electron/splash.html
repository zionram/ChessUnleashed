<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file:; img-src 'self' data: file:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Unleashed Loading</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --panel: rgba(15, 23, 42, 0.76);
        --border: rgba(148, 163, 184, 0.28);
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #f97316;
        --accent-2: #60a5fa;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--bg);
        overflow: hidden;
        font-family: Inter, Segoe UI, Arial, sans-serif;
      }
      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }
      .shell {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 41, 59, 0.88));
      }
      .art {
        position: relative;
        overflow: hidden;
        background: center/cover no-repeat url('');
      }
      .art::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(145deg, rgba(15, 23, 42, 0.35), rgba(15, 23, 42, 0.82));
      }
      .art img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.9;
      }
      .content {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        padding: 28px;
        color: var(--text);
        background: var(--panel);
        border-left: 1px solid var(--border);
        box-shadow: -16px 0 48px rgba(0, 0, 0, 0.25);
      }
      .title {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      h1 {
        margin: 0;
        font-size: 1.7rem;
        line-height: 1.15;
      }
      .subtle {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .status-box {
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .status-line {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        font-size: 0.88rem;
      }
      .status {
        font-weight: 600;
      }
      .progress-track {
        width: 100%;
        height: 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.10);
        overflow: hidden;
        position: relative;
      }
      .progress-bar {
        height: 100%;
        width: 18%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        transition: width 220ms ease;
      }
      .indeterminate {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        width: 35%;
        transform: translateX(-120%);
        animation: sweep 1.1s infinite ease-in-out;
      }
      .steps {
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .step {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .step strong {
        color: var(--text);
        font-weight: 600;
      }
      @keyframes sweep {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(360%); }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="art" id="artPanel"></div>
      <div class="content">
        <div class="title">
          <h1>Chess Unleashed</h1>
          <div class="subtle">Starting application and loading game systems.</div>
        </div>
        <div class="status-box">
          <div class="status-line">
            <span class="status" id="statusText">Starting Chess Unleashed...</span>
            <span id="progressText">10%</span>
          </div>
          <div class="progress-track" aria-label="Loading progress">
            <div class="progress-bar" id="progressBar"></div>
            <div class="indeterminate"></div>
          </div>
          <div class="steps">
            <div class="step"><span>App shell</span><strong>Loading</strong></div>
            <div class="step"><span>Assets</span><strong>Loading</strong></div>
            <div class="step"><span>Main window</span><strong>Waiting</strong></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const image = params.get('image');
      const artPanel = document.getElementById('artPanel');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const statusText = document.getElementById('statusText');

      if (image) {
        artPanel.style.backgroundImage = `url("${decodeURIComponent(image)}")`;
      } else {
        artPanel.style.background = 'linear-gradient(135deg, rgba(249,115,22,0.22), rgba(37,99,235,0.28))';
      }

      let currentProgress = 10;
      const setProgress = (value) => {
        currentProgress = Math.max(10, Math.min(100, Number(value) || currentProgress));
        progressBar.style.width = `${currentProgress}%`;
        progressText.textContent = `${Math.round(currentProgress)}%`;
      };

      const setStatus = (value) => {
        if (typeof value === 'string' && value.trim()) {
          statusText.textContent = value;
        }
      };

      window.chessUnleashedSplash?.onStatus?.((payload) => {
        if (!payload) return;
        if (payload.status) setStatus(payload.status);
        if (payload.progress !== undefined) setProgress(payload.progress);
      });

      setInterval(() => {
        if (currentProgress < 92) {
          setProgress(currentProgress + 0.15);
        }
      }, 200);
    </script>
  </body>
</html>
